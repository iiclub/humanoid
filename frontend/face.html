<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Humanoid · Face</title>
  <!-- Add to Home screen with this and the page launches with no address bar
       and no status bar — the only way to get reliable fullscreen on Android,
       since a tap-requested fullscreen is refusable and is lost on reload. -->
  <link rel="manifest" href="face.webmanifest">
  <link rel="stylesheet" href="css/face.css">
</head>
<body>

  <!-- The face is the whole page, open-eyed and blinking from the first frame.
       It must never load with the lids shut: a black lid on a black background
       is an invisible page. Tapping the wake dot only starts the audio, the
       microphone and fullscreen — it does not make the eyes appear. -->
  <main class="stage" id="stage">

    <div class="face" id="face">

      <div class="eye" id="eyeL">
        <div class="ball">
          <div class="iris">
            <span class="fibers"></span>
            <span class="pupil"></span>
            <span class="hi hi1"></span>
            <span class="hi hi2"></span>
          </div>
        </div>
        <span class="shade"></span>
        <span class="lid top"></span>
        <span class="lid bot"></span>
      </div>

      <div class="eye" id="eyeR">
        <div class="ball">
          <div class="iris">
            <span class="fibers"></span>
            <span class="pupil"></span>
            <span class="hi hi1"></span>
            <span class="hi hi2"></span>
          </div>
        </div>
        <span class="shade"></span>
        <span class="lid top"></span>
        <span class="lid bot"></span>
      </div>

    </div>

    <!-- Camera view. Replaces the face while a photo is being taken. -->
    <div class="camera" id="camera" hidden>
      <video id="video" playsinline autoplay muted></video>
      <div class="countdown" id="countdown"></div>
      <div class="shutter" id="shutter"></div>
      <img class="shot" id="shot" alt="" hidden>
    </div>

    <!-- Almost no buttons. Chrome for Android still refuses to open the
         microphone without a user gesture, so the whole screen is the gesture
         target: a single tap anywhere starts listening. The one exception is
         the ⛶ below. See wireGestures() in js/face.js. -->


    <!-- The one button on the page. Chrome for Android only grants fullscreen
         from a user gesture and can refuse a tap that is also doing other
         work, so this exists as an unambiguous request. CSS hides it the
         moment fullscreen is actually on, and in an installed PWA where
         there is no browser chrome to escape in the first place. -->
    <button class="fullbtn" id="btnFull" type="button" aria-label="Full screen">⛶</button>

    <!-- Debug overlay. Hidden unless you double-tap, or something breaks. -->
    <div class="hud" id="hud" hidden>
      <div class="status">
        <span class="dot" id="dot"></span>
        <span id="statusText">asleep</span>
      </div>
      <div class="caption" id="caption"></div>
    </div>

  </main>

  <canvas id="canvas" hidden></canvas>
  <!-- The live-dance analyser is a module (it shares the move library with
       the Dance tab's generator); face.js is a classic script and reaches it
       through window.liveDance. Loaded first so the global exists by the time
       a `live` message can arrive. -->
  <script type="module" src="js/livedance.js"></script>
  <script src="js/face.js"></script>
</body>
</html>
